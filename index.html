<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MRKOO Tesla CarPlay</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>
<body>
<iframe src="https://www.zbox.link"></iframe>
<script>
function resize(){
 document.body.style.width=window.innerWidth+'px';
 document.body.style.height=window.innerHeight+'px';
}
resize();
window.addEventListener('resize',resize);
</script>
</body>
</html>
